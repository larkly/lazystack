name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.0.5)"
        required: true

permissions:
  contents: write

jobs:
  # Every other job depends on validate, so nothing is tested, built or
  # published until the tag is known to be a well-formed release tag that
  # exists as refs/tags/<tag>. It runs for tag pushes as well as manual runs.
  # The raw tag only ever reaches shell scripts through env, never through
  # ${{ }} interpolation into script source.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate tag format
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Refusing to release: tag is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag exists
        env:
          TAG: ${{ steps.tag.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag refs/tags/$TAG does not exist"
            exit 1
          fi

  test:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run tests
        run: make test

  build:
    needs: [validate, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          bin="lazystack-${GOOS}-${GOARCH}"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "../${bin}" ./cmd/lazystack

      - uses: actions/upload-artifact@v7
        with:
          name: lazystack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lazystack-${{ matrix.goos }}-${{ matrix.goarch }}

  package:
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.version }}

      - name: Download linux binary
        uses: actions/download-artifact@v8
        with:
          name: lazystack-linux-${{ matrix.goarch }}

      - name: Prepare binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          chmod +x "lazystack-linux-${GOARCH}"
          cp "lazystack-linux-${GOARCH}" lazystack

      # Pinned version and archive checksum (from the release's checksums.txt).
      # The archive is verified before it is extracted, and nFPM is installed
      # into a runner-owned directory without sudo. Bump both values together.
      - name: Install nFPM
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c --strict -
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nfpm/nfpm" --version

      - name: Build deb
        env:
          NFPM_ARCH: ${{ matrix.deb_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package --packager deb --target "lazystack_${VERSION}_${NFPM_ARCH}.deb"

      - name: Build rpm
        env:
          NFPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package --packager rpm --target "lazystack-${VERSION}-1.${NFPM_ARCH}.rpm"

      - name: Build Arch package
        env:
          NFPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package --packager archlinux --target "lazystack-${VERSION}-1-${NFPM_ARCH}.pkg.tar.zst"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.goarch }}
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst

  release:
    needs: [validate, build, package]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.version }}
          path: source
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/src/go.mod
          cache-dependency-path: source/src/go.sum

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One line per released file, each listed exactly once; the manifest
      # never lists itself.
      - name: Generate checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
            | LC_ALL=C sort \
            | xargs -r -d '\n' sha256sum -- > SHA256SUMS
          if [ ! -s SHA256SUMS ]; then
            echo "::error::No release assets to checksum"
            exit 1
          fi
          dupes=$(awk '{print $2}' SHA256SUMS | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate SHA256SUMS entries: $dupes"
            exit 1
          fi
          sha256sum -c --strict --quiet SHA256SUMS

      # The self-updater only trusts SHA256SUMS with a valid Ed25519
      # signature from the key embedded in the client, so a release is never
      # published without SHA256SUMS.sig. releasesign also refuses a key that
      # does not match selfupdate.ReleaseSigningPublicKey at this tag.
      - name: Sign checksums
        working-directory: source/src
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set; refusing to publish an unsigned release"
            exit 1
          fi
          go run ./internal/selfupdate/cmd/releasesign sign "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          test -s "$GITHUB_WORKSPACE/dist/SHA256SUMS.sig"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Parse checksums
        id: shas
        working-directory: dist
        run: |
          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            asset="lazystack-${platform/_/-}"
            hash=$(awk -v f="$asset" '$2 == f { print $1 }' SHA256SUMS)
            if [ -z "$hash" ]; then
              echo "::error::No checksum for $asset"
              exit 1
            fi
            echo "${platform}=${hash}" >> "$GITHUB_OUTPUT"
          done

      - name: Compute source tarball checksum
        id: src_sha
        run: |
          curl -fsSL --proto '=https' -o source.tar.gz \
            "https://github.com/larkly/lazystack/archive/refs/tags/${VERSION}.tar.gz"
          echo "source=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Dispatch payloads are serialized with jq so tag and checksum values
      # are always JSON strings, never spliced into JSON text.
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA_DARWIN_ARM64: ${{ steps.shas.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.shas.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.shas.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.shas.outputs.linux_amd64 }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg darwin_arm64 "$SHA_DARWIN_ARM64" \
            --arg darwin_amd64 "$SHA_DARWIN_AMD64" \
            --arg linux_arm64 "$SHA_LINUX_ARM64" \
            --arg linux_amd64 "$SHA_LINUX_AMD64" \
            '{event_type: "update-formula", client_payload: {
                version: $version,
                sha256_darwin_arm64: $darwin_arm64,
                sha256_darwin_amd64: $darwin_amd64,
                sha256_linux_arm64: $linux_arm64,
                sha256_linux_amd64: $linux_amd64}}' \
            | gh api --method POST repos/larkly/homebrew-tap/dispatches --input -

      - name: Update AUR package
        env:
          GH_TOKEN: ${{ secrets.AUR_REPO_TOKEN }}
          SHA_SOURCE: ${{ steps.src_sha.outputs.source }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg source "$SHA_SOURCE" \
            '{event_type: "update-pkgbuild", client_payload: {
                version: $version,
                sha256_source: $source}}' \
            | gh api --method POST repos/larkly/aur-lazystack/dispatches --input -
